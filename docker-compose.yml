services:
  # PostgreSQL - Primary - Command(write)
  postgres:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockly}
      POSTGRES_USER: ${POSTGRES_USER:-blockly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blocklypwd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/pg_hba.conf:/etc/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "hba_file=/etc/pg_hba.conf"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "commit_delay=100000"
    ports:
      - "5433:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Replica - Query(read)
  postgres-replica:
    image: postgres:16.1
    environment:
      PGUSER: ${POSTGRES_USER:-blockly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blocklypwd}
    ports:
      - "5434:5432"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockly}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        rm -rf /var/lib/postgresql/data/*
        until PGPASSWORD="$$POSTGRES_PASSWORD" pg_basebackup -h postgres -D /var/lib/postgresql/data -U "$$PGUSER" -Fp -Xs -P -R; do
          echo 'Waiting for master to be ready...'
          sleep 2s
        done
        chown -R postgres:postgres /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
        echo 'Base backup completed, starting replica...'
        exec gosu postgres postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB

  # PgBouncer для записи (мастер)
  pgbouncer-write:
    image: pgbouncer/pgbouncer:latest
    container_name: pgbouncer-write
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: blockly
      DATABASES_USER: blockly
      DATABASES_PASSWORD: blocklypwd
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 30
      PGBOUNCER_LISTEN_PORT: 6432
      PGBOUNCER_AUTH_TYPE: any
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_SERVER_LIFETIME: 1800
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


  # PgBouncer для чтения (реплика)
  pgbouncer-read:
    image: pgbouncer/pgbouncer:latest
    container_name: pgbouncer-read
    environment:
      DATABASES_HOST: postgres-replica
      DATABASES_PORT: 5432
      DATABASES_DBNAME: blockly
      DATABASES_USER: blockly
      DATABASES_PASSWORD: blocklypwd
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 250
      PGBOUNCER_DEFAULT_POOL_SIZE: 60
      PGBOUNCER_QUERY_WAIT_TIMEOUT: 300
      PGBOUNCER_LISTEN_PORT: 6432
      PGBOUNCER_AUTH_TYPE: any
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_SERVER_LIFETIME: 1800
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      - "6433:6432"
    depends_on:
      postgres-replica:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./keycloak-realm-config:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Kafka Controllers
  controller-1:
    image: apache/kafka-native:latest
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network
    restart: unless-stopped

  controller-2:
    image: apache/kafka-native:latest
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network
    restart: unless-stopped

  controller-3:
    image: apache/kafka-native:latest
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - app-network
    restart: unless-stopped

  # Kafka Brokers
  broker-1:
    image: apache/kafka-native:latest
    container_name: broker-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 30
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'test' | nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  broker-2:
    image: apache/kafka-native:latest
    container_name: broker-2
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 30
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "echo 'test' | nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  broker-3:
    image: apache/kafka-native:latest
    container_name: broker-3
    ports:
      - "49092:9092"
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_NUM_PARTITIONS: 30
    depends_on:
      - controller-1
      - controller-2
      - controller-3
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "echo 'test' | nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Eureka Discovery
  discovery:
    build:
      context: ./discovery
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      KEYCLOAK_ADDRESS: http://keycloak:8080
      KEYCLOAK_REALM: appliner
    depends_on:
      discovery:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    ports:
      - "8180:8080"

  # Routing
  routing:
    build:
      context: ./routing
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      MANAGEMENT_SERVER_PORT: 8086
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    ports:
      - "8081:8081"
      - "8086:8086"
    depends_on:
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Blockly-executor
  blockly-executor-1:
    build:
      context: ./blockly-executor
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockly}
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer-write:6432/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://pgbouncer-read:6432/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_READ_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_READ_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_LIQUIBASE_ENABLED: true
      JAVA_TOOL_OPTIONS: "-Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
      SPRING_KAFKA_LISTENER_MAX_POLL_RECORDS: 10
      BLOCKLY_KAFKA_CONCURRENCY: 6
      BLOCKLY_GRAAL_POOL_SIZE: 6
      SPRING_KAFKA_LISTENER_MAX_POLL_INTERVAL_MS: "300000"
      SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 500
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      discovery:
        condition: service_healthy
      pgbouncer-write:
        condition: service_started
      pgbouncer-read:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - app-network
    ports:
      - "8090:8086"
    restart: unless-stopped


  blockly-executor-2:
    build:
      context: ./blockly-executor
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockly}
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgbouncer-write:6432/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_READ_URL: jdbc:postgresql://pgbouncer-read:6432/${POSTGRES_DB}?prepareThreshold=0
      SPRING_DATASOURCE_READ_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_READ_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker-1:19092,broker-2:19092,broker-3:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_LIQUIBASE_ENABLED: true
      JAVA_TOOL_OPTIONS: "-Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp"
      SPRING_KAFKA_LISTENER_MAX_POLL_RECORDS: 10
      BLOCKLY_KAFKA_CONCURRENCY: 6
      BLOCKLY_GRAAL_POOL_SIZE: 6
      SPRING_KAFKA_LISTENER_MAX_POLL_INTERVAL_MS: "300000"
      SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 500
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      broker-1:
        condition: service_healthy
      broker-2:
        condition: service_healthy
      broker-3:
        condition: service_healthy
      discovery:
        condition: service_healthy
      pgbouncer-write:
        condition: service_started
      pgbouncer-read:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - app-network
    ports:
      - "8091:8086"
    restart: unless-stopped

