spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: client-service-route
              uri: lb://CLIENT-SERVICE
              predicates:
                - Path=/client-service/**
              filters:
                - StripPrefix=1
            - id: routing-service-route
              uri: lb://ROUTING
              predicates:
                - Path=/routing/**
              filters:
                - StripPrefix=1
            - id: executor-executions
              uri: lb://blockly-executor
              predicates:
                - Path=/api/executions/**
              filters:
                - StripPrefix=0
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/${KEYCLOAK_REALM:appliner}/protocol/openid-connect/certs
          issuer-uri: http://localhost:8080/realms/${KEYCLOAK_REALM:appliner}

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}