databaseChangeLog:
  - changeSet:
      id: 002-create-categories
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: tenant_appliner
              tableName: categories
      changes:
        - createTable:
            schemaName: tenant_appliner
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            schemaName: tenant_appliner
            tableName: categories

  - changeSet:
      id: 002-create-orders
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: tenant_appliner
              tableName: orders
      changes:
        - createTable:
            schemaName: tenant_appliner
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total
                  type: NUMERIC(10,2)
                  defaultValueNumeric: 0
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: pending
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            schemaName: tenant_appliner
            tableName: orders

  - changeSet:
      id: 002-create-order-items
      author: developer
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              schemaName: tenant_appliner
              tableName: order_items
      changes:
        - createTable:
            schemaName: tenant_appliner
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  defaultValueNumeric: 1
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            schemaName: tenant_appliner
            tableName: order_items
